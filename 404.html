<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SOFWAH MIRAX</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png?v=3" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/icon-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIRAX">
<style>
html,body{margin:0;height:100%;background:#070d1a;color:#e8eefb;font-family:Poppins,Arial,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(800px 600px at 0 0,rgba(59,140,255,.16),transparent 60%),radial-gradient(800px 600px at 100% 0,rgba(255,154,6,.08),transparent 60%),#070d1a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s}
iframe.on{opacity:1}
.load{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
.load img{width:72px;height:72px;border-radius:22px;box-shadow:0 14px 34px rgba(115,13,4,.3);animation:p 1.6s ease-in-out infinite}
.load b{display:block;margin-top:16px;letter-spacing:.4em;font-size:18px;padding-left:.4em}
.load small{display:block;color:#ff9a06;letter-spacing:.12em;font-size:10.5px;margin-top:4px;font-weight:600}
.load p{color:#6c7c9c;font-size:12px;margin-top:22px;max-width:300px}
.load a{color:#60a5fa}
@keyframes p{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div class="load" id="ld"><div><img src="/icons/icon-192.png?v=3" alt=""><b>MIRAX</b><small>MARKETING INTELLIGENCE, REVENUE ACTIVATION &amp; EXECUTION</small><p id="msg">Loading…</p></div></div>
<iframe id="app" title="SOFWAH MIRAX" allow="clipboard-write; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwSMN6dPCQrccg1plzyObHUFi1ceVOcb0E4m-DUheGLN5I8kjhVdXbbIqlzCQIST6B4/exec';
  var f = document.getElementById('app'), ld = document.getElementById('ld');
  function boot() {
    var pg = (location.search.match(/[?&]page=([a-z]{1,12})/) || [])[1] || '';
    f.src = EXEC + (pg ? '?page=' + pg : '');
    f.onload = function () { f.className = 'on'; setTimeout(function () { ld.style.display = 'none'; }, 400); };
    setTimeout(function () { if (f.className !== 'on') document.getElementById('msg').innerHTML = 'Slow connection. <a href="' + f.src + '" rel="noopener">Open directly</a> or reload.'; }, 15000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
  // Enforce HTTPS: on plain http, confirm the HTTPS certificate works, then move to https (never load the app over http).
  if (location.protocol === 'http:' && /(^|\.)sofwah\.my$/.test(location.hostname)) {
    var u = 'https://' + location.host + location.pathname + location.search + location.hash;
    var settled = false, done = function (ok) { if (settled) return; settled = true; if (ok) location.replace(u); else boot(); };
    fetch('https://' + location.hostname + '/manifest.webmanifest?probe=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(function () { done(true); }, function () { done(false); });
    setTimeout(function () { done(false); }, 3500);
  } else boot();
})();
</script>
</body>
</html>
